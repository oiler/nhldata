[project]
name = "nhl-analytics"
version = "0.1.0"
description = "NHL game data analytics and timeline generation"
requires-python = ">=3.11.5"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "anthropic>=0.40.0",
    # Same pandas as browser/requirements.txt, so the pipeline builds league.db
    # with the version the browser reads it with.
    "pandas==3.0.0",
    # numpy 2.4 needs SSE4.2 and POPCNT. mininet, the Core 2 Duo machine that
    # runs the daily pipeline, has neither, and numpy 2.4 refuses to import
    # there (Decision Queue D80). Stay on 2.3 while mininet runs the pipeline.
    "numpy>=2.3,<2.4",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# The code installs as an editable package, so scripts and tests import it by
# package name with no sys.path setup. Only folders with an __init__.py count;
# data/ and the docs folders are never scanned as packages.
[tool.setuptools.packages.find]
where = ["."]
include = ["browser", "browser.*", "pipeline", "pipeline.*", "research", "research.*"]
namespaces = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["browser", "pipeline", "research"]
markers = [
    "requires_data: reads the local data/ pipeline tree, which is gitignored and absent from a bare checkout. Run from the repo root; CI deselects these with -m 'not requires_data'.",
]
